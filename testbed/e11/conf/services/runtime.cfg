# HOMEPROV E11 overrides of the distribution's runtime.cfg defaults (only these four):
# the regional time zone is UTC (the container also runs with TZ=UTC), so the DAO's 'localtime' text is UTC;
# the default persistence service is jdbc; REST reads require an authenticated user (no implicit user role);
# HTTP Basic authentication is allowed, so the harness reads history as each household account.
org.openhab.i18n:timezone=UTC
org.openhab.persistence:default=jdbc
org.openhab.restauth:implicitUserRole=false
org.openhab.restauth:allowBasicAuth=true
